<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area Teen Events — SPARK!</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #1B2E4A;
      --yellow: #FFD000;
      --orange: #FF6B2B;
      --sky:    #4A90D9;
      --green:  #4BAF47;
      --cream:  #FDF8F2;
      --warm-white: #FFFDF9;
      --text:   #1B2E4A;
      --muted:  #5a6a7a;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--warm-white);
      color: var(--text);
      line-height: 1.6;
    }

    /* NAV */
    nav {
      background: var(--navy);
      padding: 0.7rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .nav-logo {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: var(--yellow);
      text-decoration: none;
    }
    .nav-logo span { color: var(--orange); }
    .nav-back {
      color: rgba(255,255,255,0.7);
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
    }
    .nav-back:hover { color: var(--yellow); }

    /* PAGE HEADER */
    .page-header {
      background: var(--navy);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      border-bottom: 4px solid var(--yellow);
    }
    .page-header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--yellow);
      margin-bottom: 0.4rem;
    }
    .page-header p {
      color: rgba(255,255,255,0.6);
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* CONTENT */
    .content {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    /* EVENT CARD */
    .event-card {
      background: var(--cream);
      border-radius: 1.25rem;
      overflow: hidden;
      border: 2px solid #e0d8ce;
      margin-bottom: 2rem;
    }
    .event-dates {
      padding: 1.5rem 2rem 0.5rem;
    }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e0d8ce;
    }
    .date-row:last-child { border-bottom: none; }
    .date-badge {
      background: var(--orange);
      color: white;
      font-weight: 800;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .dj-name {
      font-weight: 700;
      color: var(--navy);
      text-align: right;
    }

    .event-meta {
      padding: 1.25rem 2rem;
      font-weight: 600;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .event-meta p { margin-bottom: 0.5rem; }
    .event-meta p:last-child { margin-bottom: 0; }

    /* TRANSPORT ALERT */
    .transport-alert {
      background: #FFF3E0;
      border: 2px solid var(--orange);
      border-radius: 1rem;
      padding: 1.5rem;
      margin: 0 2rem 1.5rem;
    }
    .transport-alert h3 {
      font-family: 'Fredoka One', cursive;
      color: var(--navy);
      font-size: 1.05rem;
      margin-bottom: 0.6rem;
    }
    .transport-alert p {
      font-weight: 600;
      color: var(--text);
      font-size: 0.92rem;
      margin-bottom: 0.6rem;
    }
    .transport-alert p:last-child { margin-bottom: 0; }
    .transport-alert strong { color: var(--navy); }

    .event-footer {
      padding: 0 2rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .event-flyer {
      display: block;
      width: 100%;
      height: auto;
    }

    .more-note {
      text-align: center;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 1rem 0 2rem;
    }

    /* FOOTER */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.5);
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 3rem;
    }
    footer a { color: var(--yellow); text-decoration: none; }

    @media (max-width: 500px) {
      .date-row { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
      .dj-name { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">SPARK<span>!</span></a>
    <a href="index.html" class="nav-back">← Back to main site</a>
  </nav>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>Area Teen Events</h1>
    <p>Other things happening for teens around the Chequamegon Bay area</p>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <p class="more-note">No area teen events are posted right now. New events will be posted here as we hear about them.</p>

  </div>

  <!-- FOOTER -->
  <footer>
    <a href="index.html">← Back to SPARK! main site</a>
  </footer>

</body>
</html>
